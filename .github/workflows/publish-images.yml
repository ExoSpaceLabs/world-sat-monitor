name: Publish container images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-images-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validated main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Enforce immutable release version
        id: release
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | awk 'NR==1 {print $1}')"
          if [[ -n "$existing" && "$existing" != "$VALIDATED_SHA" ]]; then
            echo "Release ${tag} already points to ${existing}; bump VERSION before publishing another main revision." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -z "$existing" ]]; then
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate pull-only Compose definition
        run: |
          docker compose -f compose.images.yaml config --quiet
          if docker compose -f compose.images.yaml config | grep -qE '^[[:space:]]+build:'; then
            echo "compose.images.yaml must not contain build directives" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/exospacelabs/world-sat-monitor-frontend:${{ steps.version.outputs.version }}
            ghcr.io/exospacelabs/world-sat-monitor-frontend:latest
            ghcr.io/exospacelabs/world-sat-monitor-frontend:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.title=WorldSat Monitor Frontend
            org.opencontainers.image.source=https://github.com/ExoSpaceLabs/world-sat-monitor
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/exospacelabs/world-sat-monitor-backend:${{ steps.version.outputs.version }}
            ghcr.io/exospacelabs/world-sat-monitor-backend:latest
            ghcr.io/exospacelabs/world-sat-monitor-backend:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.title=WorldSat Monitor Backend
            org.opencontainers.image.source=https://github.com/ExoSpaceLabs/world-sat-monitor
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Tag validated release commit
        if: steps.release.outputs.create_tag == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$VALIDATED_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"
