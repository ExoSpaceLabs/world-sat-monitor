events {}

http {
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json application/geo+json text/plain text/css application/javascript;

    server {
        listen 80;
        server_name _;
        location /map/openfreemap/ {
            proxy_pass https://tiles.openfreemap.org/;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name tiles.openfreemap.org;
            proxy_set_header Host tiles.openfreemap.org;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_set_header Accept-Encoding "";
            proxy_redirect off;
            sub_filter_once off;
            sub_filter_types application/json text/plain;
            sub_filter 'https://tiles.openfreemap.org' '/map/openfreemap';
        }
        location /api/v1/catalog/ {
            proxy_pass http://orbital-provider:8010/catalog/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
