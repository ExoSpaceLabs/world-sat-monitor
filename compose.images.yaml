name: world-sat-monitor

services:
  gateway:
    image: nginx:stable-alpine
    container_name: world-sat-monitor-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "3000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro

  frontend:
    image: ghcr.io/exospacelabs/world-sat-monitor-frontend:${WORLDSAT_IMAGE_TAG:-1.0.0}
    container_name: world-sat-monitor-frontend
    restart: unless-stopped
    expose:
      - "3000"

  backend:
    image: ghcr.io/exospacelabs/world-sat-monitor-backend:${WORLDSAT_IMAGE_TAG:-1.0.0}
    container_name: world-sat-monitor-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://worldsat:worldsat@db:5432/worldsat
      APP_SETTINGS_PATH: /data/settings.json
      MOCK_SEED_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - settings_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s

  orbital-provider:
    image: ghcr.io/exospacelabs/world-sat-monitor-backend:${WORLDSAT_IMAGE_TAG:-1.0.0}
    container_name: world-sat-monitor-orbital-provider
    restart: unless-stopped
    command: ["python", "-m", "app.provider_service"]
    environment:
      DATABASE_URL: postgresql://worldsat:worldsat@db:5432/worldsat
      PROVIDER_POLL_SECONDS: "${PROVIDER_POLL_SECONDS:-5}"
      PROVIDER_REFRESH_SECONDS: "${PROVIDER_REFRESH_SECONDS:-7200}"
      CELESTRAK_ENABLED: "${CELESTRAK_ENABLED:-true}"
      CELESTRAK_BASE_URL: "${CELESTRAK_BASE_URL:-https://celestrak.org/NORAD/elements/gp.php}"
      CELESTRAK_CATALOG_URL: "${CELESTRAK_CATALOG_URL:-https://celestrak.org/satcat/records.php}"
      CELESTRAK_TIMEOUT_SECONDS: "${CELESTRAK_TIMEOUT_SECONDS:-15}"
      PROVIDER_HEALTH_PORT: "8010"
      PROPAGATION_HISTORY_HOURS: "${PROPAGATION_HISTORY_HOURS:-48}"
      PROPAGATION_HORIZON_DAYS: "${PROPAGATION_HORIZON_DAYS:-14}"
      PROPAGATION_STEP_SECONDS: "${PROPAGATION_STEP_SECONDS:-60}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s

  propagator:
    image: ghcr.io/exospacelabs/world-sat-monitor-backend:${WORLDSAT_IMAGE_TAG:-1.0.0}
    container_name: world-sat-monitor-propagator
    restart: unless-stopped
    command: ["python", "-m", "app.propagator_service"]
    environment:
      DATABASE_URL: postgresql://worldsat:worldsat@db:5432/worldsat
      PROPAGATOR_POLL_SECONDS: "${PROPAGATOR_POLL_SECONDS:-2}"
      PROPAGATOR_HEALTH_PORT: "8011"
      PROPAGATION_HISTORY_HOURS: "${PROPAGATION_HISTORY_HOURS:-48}"
      PROPAGATION_HORIZON_DAYS: "${PROPAGATION_HORIZON_DAYS:-14}"
      PROPAGATION_STEP_SECONDS: "${PROPAGATION_STEP_SECONDS:-60}"
      PROPAGATION_NEAR_HORIZON_HOURS: "${PROPAGATION_NEAR_HORIZON_HOURS:-24}"
      PROPAGATION_MID_HORIZON_HOURS: "${PROPAGATION_MID_HORIZON_HOURS:-72}"
      PROPAGATION_MID_STEP_SECONDS: "${PROPAGATION_MID_STEP_SECONDS:-300}"
      PROPAGATION_FAR_STEP_SECONDS: "${PROPAGATION_FAR_STEP_SECONDS:-900}"
      PROPAGATION_SAMPLE_RETENTION_HOURS: "${PROPAGATION_SAMPLE_RETENTION_HOURS:-24}"
      PROPAGATION_CLEANUP_INTERVAL_SECONDS: "${PROPAGATION_CLEANUP_INTERVAL_SECONDS:-300}"
      PROPAGATION_CLEANUP_BATCH_SIZE: "${PROPAGATION_CLEANUP_BATCH_SIZE:-250000}"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8011"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8011/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s

  db:
    image: postgres:17-bookworm
    container_name: world-sat-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: worldsat
      POSTGRES_USER: worldsat
      POSTGRES_PASSWORD: worldsat
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldsat -d worldsat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  settings_data:
